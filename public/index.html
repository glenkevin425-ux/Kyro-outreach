<body>
<div id="app" aria-live="polite"></div>
<div class="toast-stack" id="toast-stack" aria-live="assertive"></div>
<script>
const app = document.getElementById('app');
const state = {boot:null, page:'Dashboard', modal:null, search:'', prospectFilter:'All', prospectSort:'newest', prospectPage:1, prospectTotal:0, prospects:[], campaigns:[], analytics:null, settings:null, queue:null, compose:null, mobileOpen:false, importRows:[], notifications:false};
const NAV = [
  ['Dashboard','grid'],['Prospects','users'],['Queue','queue'],['Campaigns','layers'],['Analytics','chart'],['Settings','settings']
];
const ICON = {
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 queue:'<path d="M4 5h16M4 12h16M4 19h9"/><circle cx="18" cy="18" r="3"/>',
 layers:'<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/>',
 chart:'<path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 6-7"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.8-.7a8 8 0 0 1-1.7 1l-.3 1.9h-2.8l-.3-1.9a8 8 0 0 1-1.7-1l-1.8.7-1.4-2.4 1.5-1.2a7 7 0 0 1 0-2l-1.5-1.2 1.4-2.4 1.8.7a8 8 0 0 1 1.7-1l.3-1.9h2.8l.3 1.9a8 8 0 0 1 1.7 1l1.8-.7 1.4 2.4-1.5 1.2a7 7 0 0 1 0 2Z" transform="translate(-1 -1)"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>', bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', close:'<path d="m18 6-12 12M6 6l12 12"/>', upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>', check:'<path d="m5 12 4 4L19 6"/>', more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>', chev:'<path d="m9 18 6-6-6-6"/>', globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>', spark:'<path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 14 1 2.5 2.5 1-2.5 1L19 21l-1-2.5-2.5-1 2.5-1L19 14Z"/>', shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/>', dots:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>', eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>', pause:'<path d="M8 5h3v14H8zM15 5h3v14h-3z"/>', play:'<path d="m7 4 14 8-14 8V4Z"/>', trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/>', edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>', download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>', send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>', refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 2M4 16l2 2a7 7 0 0 0 12.4-3"/>', filter:'<path d="M4 7h16M7 12h10m-7 5h4"/>', calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>'
};
function icon(name,size=16){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]||ICON.grid}</svg>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function titleCase(s){return String(s||'').replace(/[_-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function prettyDate(v,withTime=false){if(!v)return '—';let d=new Date(v);if(Number.isNaN(+d))return '—';return new Intl.DateTimeFormat(undefined,withTime?{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}:{month:'short',day:'numeric',year:'numeric'}).format(d)}
function relativeDate(v){if(!v)return '—';const n=Date.now(), d=new Date(v), days=Math.round((n-d)/86400000);if(days===0)return 'Today';if(days===1)return 'Yesterday';if(days<0)return 'In '+Math.abs(days)+'d';if(days<7)return days+'d ago';return prettyDate(v)}
function statusClass(s){return String(s||'').toLowerCase().replaceAll(' ','-')}
function toast(message,type='success',detail=''){const stack=document.getElementById('toast-stack');const el=document.createElement('div');el.className='toast '+type;el.innerHTML=esc(message)+(detail?`<small>${esc(detail)}</small>`:'');stack.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(5px)';setTimeout(()=>el.remove(),240)},3800)}
async function api(path,options={}){const method=(options.method||'GET').toUpperCase(), headers={'Accept':'application/json',...(options.headers||{})};if(options.body!==undefined){headers['Content-Type']='application/json';options.body=JSON.stringify(options.body)}if(['POST','PUT','PATCH','DELETE'].includes(method)&&state.boot?.csrf)headers['X-CSRF-Token']=state.boot.csrf;let res;try{res=await fetch(path,{...options,method,headers,credentials:'same-origin'})}catch(e){throw new Error('Kyro could not reach the server. Check your connection and try again.')}let data={};try{data=await res.json()}catch(e){}if(!res.ok){if(res.status===401&&state.boot?.authenticated){await boot();}throw Object.assign(new Error(data.error||'Something went wrong.'),{code:data.code,status:res.status})}return data}
async function boot(){try{state.boot=await fetch('/api/bootstrap',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json());if(!state.boot.authenticated&&state.boot.demo_enabled){const demo=await fetch('/api/auth/demo',{method:'POST',credentials:'same-origin',headers:{'Accept':'application/json','Content-Type':'application/json'},body:'{}'});if(!demo.ok){let detail={};try{detail=await demo.json()}catch(e){}throw new Error(detail.error||'Kyro could not open the workspace.')}state.boot=await fetch('/api/bootstrap',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json())}if(state.boot.authenticated){renderShell();await renderPage()}else renderAuth()}catch(e){app.innerHTML=`<div class="auth-screen"><div class="auth-panel"><div class="auth-box"><h2>Kyro is offline</h2><p class="auth-lead">${esc(e.message||'The application server could not be reached. Refresh in a moment.')}</p><button class="btn primary" data-action="reload">Retry connection</button></div></div></div>`}}
function renderAuth(mode='home'){
const setup=state.boot?.setup_required;const showSetup=mode==='setup';const showLogin=mode==='login';
app.innerHTML=`<main class="auth-screen"><section class="auth-story"><div class="brand"><div class="brandmark">K</div><div><div class="brandname">KYRO</div><div class="brand-sub">OUTREACH</div></div></div><div class="auth-copy"><div class="auth-kicker">KCREATIVES · DESIGN. STRATEGY. GROWTH.</div><h1>Good outreach is <span>considered.</span></h1><p>A calm, controlled workspace for discovering prospects, writing relevant emails, and keeping every send accountable.</p><div style="display:flex;gap:8px;align-items:center;margin-top:24px;color:#72818a;font-size:10px">${icon('shield',15)} Approval-first · 10 sends per day · Suppression protected</div></div><div class="auth-foot">Kyro is an internal operating system for Kcreatives.</div></section><section class="auth-panel"><div class="auth-box">${showSetup?`<h2>Create your workspace</h2><p class="auth-lead">Start with a private Kcreatives workspace. Your account is protected by a password and secure session.</p><form id="setup-form"><div class="form-error" id="auth-error"></div><div class="field"><label for="setup-name">Your name</label><input id="setup-name" name="display_name" required autocomplete="name" placeholder="Glen"></div><div class="field"><label for="setup-email">Sign-in email</label><input id="setup-email" name="email" type="email" required autocomplete="email" placeholder="you@company.com"></div><div class="field"><label for="setup-password">Password</label><input id="setup-password" name="password" type="password" required minlength="12" autocomplete="new-password" placeholder="At least 12 characters"></div><button class="btn primary auth-submit" type="submit">Create secure workspace ${icon('arrow',14)}</button></form><button class="auth-link" data-action="auth-home">Back</button>`:showLogin?`<h2>Welcome back</h2><p class="auth-lead">Sign in to continue to your Kyro workspace.</p><form id="login-form"><div class="form-error" id="auth-error"></div><div class="field"><label for="login-email">Email</label><input id="login-email" name="email" type="email" required autocomplete="username" placeholder="you@company.com"></div><div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="Your password"></div><button class="btn primary auth-submit" type="submit">Sign in ${icon('arrow',14)}</button></form>${state.boot?.demo_enabled?`<div class="auth-divider"><span>OR</span></div><button class="btn demo-enter" data-action="demo-login">Enter demo workspace</button><div class="auth-notice">Fictional records only. Demo email actions are simulated and never delivered.</div>`:''}<button class="auth-link" data-action="auth-home">Back</button>`:`<h2>${setup?'A workspace, ready to explore':'Sign in to Kyro'}</h2><p class="auth-lead">${setup?'Open the clearly labelled demo workspace, or create the first private owner account.':'Your prospects, drafts and sending controls are available after sign-in.'}</p>${state.boot?.demo_enabled?`<button class="btn demo-enter" data-action="demo-login">${icon('eye',15)} Enter DEMO MODE</button><div class="auth-notice">Explore with fictional prospects. Demo sends are simulated only; no email is delivered.</div>`:''}<div class="auth-divider"><span>OR</span></div>${setup?`<button class="btn primary auth-submit" data-action="auth-setup">Create owner workspace ${icon('arrow',14)}</button>`:`<button class="btn demo-enter" data-action="auth-login">Sign in to your workspace</button>`}</div>`}</div></section></main>`;
}
function renderShell(){
const user=state.boot?.user||{};const initial=(user.display_name||'G').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
app.innerHTML=`<div class="shell"><div class="mobile-overlay ${state.mobileOpen?'show':''}" data-action="close-mobile"></div><aside class="sidebar ${state.mobileOpen?'open':''}" aria-label="Main navigation"><div class="brand"><div class="brandmark">K</div><div><div class="brandname">KYRO</div><div class="brand-sub">OUTREACH</div></div></div><div class="nav-label">Workspace</div><nav class="nav">${NAV.map(([name,ic])=>`<a href="#${name.toLowerCase()}" class="nav-item ${state.page===name?'active':''}" data-page="${name}"><span class="nav-icon">${icon(ic,16)}</span><span>${name}</span>${name==='Queue'?'<span style="margin-left:auto;color:#738087;font-size:9px" id="side-quota"></span>':''}</a>`).join('')}</nav><div class="side-spacer"></div><div class="side-status"><span class="pulse"></span><span>Kyro Online</span><span style="margin-left:auto;color:#667179;font-size:9px">READY</span></div><div class="agency-card"><div class="agency-monogram">KC</div><div><div class="agency-name">Kcreatives</div><div class="agency-tag">Design. Strategy. Growth.</div></div><button class="account-btn" title="Account menu" data-action="account-menu">${icon('dots',16)}</button></div></aside><main class="main"><header class="topbar"><button class="mobile-toggle" data-action="toggle-mobile" aria-label="Open navigation">${icon('grid',18)}</button><div class="page-title">${state.page}</div><div class="top-spacer"></div><button class="top-search" data-action="global-search" aria-label="Search prospects">${icon('search',14)}<span>Search prospects</span><span class="shortcut">⌘ K</span></button><div style="position:relative"><button class="top-icon" data-action="notifications" aria-label="Activity notifications">${icon('bell',17)}<span class="notice-dot"></span></button></div>${user.demo_mode?'<span class="demo-badge">DEMO MODE</span>':''}<button class="top-icon" title="Account" data-action="account-menu"><span class="avatar">${esc(initial)}</span></button></header><div class="page-content" id="page-content"></div></main></div>`;
}
function navigate(page){state.page=page;state.mobileOpen=false;state.modal=null;renderShell();renderPage();}
function renderPage(){const el=document.getElementById('page-content');if(!el)return;el.innerHTML=`<div class="page-wrap"><div class="skeleton" style="height:18px;width:200px;margin:5px 0 20px"></div><div class="skeleton" style="height:84px;width:100%;margin-bottom:15px"></div><div class="skeleton" style="height:300px;width:100%"></div></div>`;if(state.page==='Dashboard')loadDashboard();else if(state.page==='Prospects')loadProspects();else if(state.page==='Queue')loadQueue();else if(state.page==='Compose')renderComposePage();else if(state.page==='Campaigns')loadCampaigns();else if(state.page==='Analytics')loadAnalytics();else if(state.page==='Settings')loadSettings();}
function pageHead(title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">${state.page==='Dashboard'?'MONDAY · '+new Intl.DateTimeFormat(undefined,{month:'long',day:'numeric',year:'numeric'}).format(new Date()).toUpperCase():state.page.toUpperCase()}</div><h1>${title}</h1><p class="page-sub">${sub}</p></div><div class="head-actions">${actions}</div></div>`}
function statusPill(status){return `<span class="pill ${statusClass(status)}">${esc(status||'Draft')}</span>`}
function demoNotice(){return state.boot?.user?.demo_mode?`<span class="demo-badge">DEMO DATA · APP RECORDED</span>`:''}

g">Daily sending capacity</div><div class="meter-number">${d.sent_today} / ${d.daily_limit} <span style="color:#718087">· ${d.remaining} remaining</span></div><div class="meter-track"><div class="meter-fill" style="width:${Math.min(100,d.sent_today/d.daily_limit*100)}%"></div></div></div><div class="grid dashboard-grid"><div class="card panel"><div class="panel-head"><div><div class="panel-title">Today’s Queue</div><div class="panel-meta">Approved and scheduled work</div></div><button class="text-link" data-action="navigate" data-page="Queue">Open queue ${icon('arrow',12)}</button></div>${qrows.length?`<div class="table-wrap"><table class="queue-table"><thead><tr><th>Time</th><th>Business</th><th>Contact</th><th>Subject</th><th>Status</th></tr></thead><tbody>${qrows.map(r=>`<tr><td>${r.scheduled_for?esc(prettyDate(r.scheduled_for,true).split(', ').slice(-1)[0]):'—'}</td><td class="business-cell">${esc(r.business_name)}</td><td>${esc(r.contact_name||'—')}</td><td>${esc(r.subject||'Untitled draft')}</td><td>${statusPill(r.status)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-mark">${icon('calendar',18)}</div><h3>Nothing is scheduled for today.</h3><p>Approved emails from active campaigns will show here. Kyro never sends a new draft without your approval.</p><button class="btn small" data-action="navigate" data-page="Queue">Review queue</button></div>`}</div><div class="grid right-col"><div class="card panel"><div class="panel-head"><div><div class="panel-title">Recent Activity</div><div class="panel-meta">${esc(d.source_label)} · audit trail</div></div><button class="top-icon" data-action="activity-log" title="Full activity">${icon('more',15)}</button></div><div class="panel-body"><div class="activity-list">${act.length?act.map(a=>`<div class="activity-item"><div class="activity-mark">${icon(activityIcon(a.type),13)}</div><div><div class="activity-text">${esc(a.description)}</div><div class="activity-time">${relativeDate(a.created_at)}${a.business_name?' · '+esc(a.business_name):''}</div></div></div>`).join(''):`<div class="empty" style="padding:20px 5px"><div class="empty-mark">${icon('clock',16)}</div><h3>No activity yet</h3><p>Kyro will record important changes here.</p></div>`}</div></div></div><div class="card panel"><div class="panel-head"><div><div class="panel-title">Conversion Funnel</div><div class="panel-meta">All-time · ${esc(d.source_label)}</div></div></div><div class="panel-body"><div class="funnel">${labels.map((x,i)=>`<div class="funnel-row"><span>${x[0]}</span><div class="funnel-bar"><div class="funnel-fill" style="width:${x[1]?Math.max(4,x[1]/max*100):0}%;opacity:${1-i*.1}"></div></div><span class="funnel-count">${x[1]||0}</span></div>`).join('')}</div><div style="margin-top:12px;font-size:9px;color:#657078">No open or click metrics are inferred.</div></div></div></div></div></div>`;const quota=document.getElementById('side-quota');if(quota)quota.textContent=`${d.sent_today}/10`}catch(e){showPageError(e)}}
function activityIcon(type){if(type.includes('sent'))return'mail';if(type.includes('reply'))return'arrow';if(type.includes('approved'))return'check';if(type.includes('suppressed'))return'shield';if(type.includes('created')||type.includes('added'))return'plus';if(type.includes('scheduled'))return'calendar';return'grid'}
function showPageError(e){const el=document.getElementById('page-content');if(el)el.innerHTML=`<div class="page-wrap"><div class="card empty"><div class="empty-mark">${icon('refresh',18)}</div><h3>Could not load this view</h3><p>${esc(e.message)}</p><button class="btn small" data-action="retry-page">Try again</button></div></div>`}
async function loadProspects(){try{const params=new URLSearchParams({q:state.search,status:state.prospectFilter,sort:state.prospectSort,page:String(state.prospectPage),limit:'20'});const d=await api('/api/prospects?'+params.toString());state.prospects=d.items;state.prospectTotal=d.total;const filters=['All','New','Contacted','Replied','Interested','Not Interested','Follow-up Due','Suppressed'];document.getElementById('page-content').innerHTML=`<div class="page-wrap">${pageHead('Prospects','A focused pipeline for verified, relevant business outreach.',`<button class="btn" data-action="import-csv">${icon('upload',14)} Import CSV</button><button class="btn primary" data-action="add-prospect">${icon('plus',14)} Add prospect</button>`)}<div class="toolbar"><input class="search-input" id="prospect-search" type="search" placeholder="Search business, contact, email…" value="${esc(state.search)}" aria-label="Search prospects"><select class="control" id="prospect-filter" aria-label="Filter prospects">${filters.map(x=>`<option ${state.prospectFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="control" id="prospect-sort" aria-label="Sort prospects">${[['newest','Newest'],['oldest','Oldest'],['recent','Recently contacted'],['followup','Follow-up due'],['business','Business name'],['status','Status']].map(([v,l])=>`<option value="${v}" ${state.prospectSort===v?'selected':''}>${l}</option>`).join('')}</select><span class="toolbar-spacer"></span><span style="font-size:10px;color:#758087">${d.total} prospects</span></div>${d.total?`<div class="card table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Business</th><th>Contact</th><th>Email</th><th>Industry</th><th>Location</th><th>Status</th><th>Last Contact</th><th>Next Follow-up</th><th></th></tr></thead><tbody>${d.items.map(p=>`<tr data-action="open-prospect" data-id="${esc(p.id)}" style="cursor:pointer"><td class="business-cell">${esc(p.business_name)}</td><td>${esc(p.contact_name||'—')}</td><td>${esc(p.email)}</td><td>${esc(p.industry||'—')}</td><td>${esc(p.location||'—')}</td><td>${statusPill(p.status)}</td><td>${p.last_contacted_at?relativeDate(p.last_contacted_at):'—'}</td><td>${p.next_follow_up_at?relativeDate(p.next_follow_up_at):'—'}</td><td><button class="table-action" data-action="row-menu" data-id="${esc(p.id)}" aria-label="Actions">${icon('more',15)}</button></td></tr>`).join('')}</tbody></table></div><div class="responsive-card-list">${d.items.map(p=>`<div class="prospect-mobile-card" data-action="open-prospect" data-id="${esc(p.id)}"><div class="prospect-card-top"><div class="prospect-card-title">${esc(p.business_name)}</div>${statusPill(p.status)}</div><div class="prospect-card-lines">${esc(p.contact_name||'No contact')} · ${esc(p.email)}<br>${esc(p.industry||'Industry not set')} · ${esc(p.location||'Location not set')}</div><div class="prospect-card-foot"><span style="font-size:9px;color:#758087">Last contact ${p.last_contacted_at?relativeDate(p.last_contacted_at):'—'}</span><button class="table-action" data-action="open-prospect" data-id="${esc(p.id)}">Open ${icon('chev',12)}</button></div></div>`).join('')}</div><div class="pagination"><span>Showing ${d.total?((d.page-1)*d.limit+1):0}–${Math.min(d.page*d.limit,d.total)} of ${d.total}</span><div class="pagination-actions"><button class="btn small" data-action="prospect-page" data-page-num="${d.page-1}" ${d.page<=1?'disabled':''}>Previous</button><button class="btn small" data-action="prospect-page" data-page-num="${d.page+1}" ${d.page>=d.pages?'disabled':''}>Next</button></div></div></div>`:`<div class="card empty"><div class="empty-mark">${icon('users',18)}</div><h3>${state.search||state.prospectFilter!=='All'?'No matching prospects':'Your pipeline is empty'}</h3><p>${state.search||state.prospectFilter!=='All'?'Try another search or filter.':'Add your first prospect or import a CSV. Verified details make better outreach.'}</p>${!state.search&&state.prospectFilter==='All'?'<button class="btn primary small" data-action="add-prospect">Add prospect</button>':''}</div>`}</div>`;const input=document.getElementById('prospect-search');if(input){input.addEventListener('input',()=>{clearTimeout(window.searchTimer);window.searchTimer=setTimeout(()=>{state.search=input.value;state.prospectPage=1;loadProspects()},220)})}document.getElementById('prospect-filter')?.addEventListener('change',e=>{state.prospectFilter=e.target.value;state.prospectPage=1;loadProspects()});document.getElementById('prospect-sort')?.addEventListener('change',e=>{state.prospectSort=e.target.value;state.prospectPage=1;loadProspects()})}catch(e){showPageError(e)}}
function field(label,name,value='',type='text',placeholder='',hint=''){return `<div class="field"><label for="f-${name}">${esc(label)}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}">${hint?`<div class="hint">${esc(hint)}</div>`:''}</div>`}
function textareaField(label,name,value='',placeholder='',hint='',rows=3){return `<div class="field"><label for="f-${name}">${esc(label)}</label><textarea id="f-${name}" name="${name}" rows="${rows}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>${hint?`<div class="hint">${esc(hint)}</div>`:''}</div>`}
function showModal(title,body,foot='',wide=false){closeModal();state.modal=true;const div=document.createElement('div');div.id='modal-backdrop';div.className='modal-backdrop';div.innerHTML=`<section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><h2 id="modal-title">${esc(title)}</h2><button class="modal-close" data-action="close-modal" aria-label="Close dialog">×</button></header><div class="modal-body">${body}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section>`;div.addEventListener('click',e=>{if(e.target===div)closeModal()});document.body.appendChild(div);div.querySelector('.modal-close')?.focus()}
function closeModal(){const m=document.getElementById('modal-backdrop');if(m)m.remove();state.modal=null}
function addProspectModal(p=null){const title=p?'Edit prospect':'Add prospect';const contacts=p?.social_urls?.join('\n')||'';const body=`<form id="prospect-form"><div class="form-error" id="modal-error"></div><div class="form-grid">${field('Business name *','business_name',p?.business_name||'','text','e.g. Nova Café')}${field('Contact name','contact_name',p?.contact_name||'','text','e.g. Amina')}${field('Email *','email',p?.email||'','email','contact@business.com')}${field('Phone','phone',p?.phone||'','tel','+254…')}${field('Website','website',p?.website||'','url','https://business.com')}${field('Industry','industry',p?.industry||'','text','e.g. Hospitality')}${field('Location','location',p?.location||'','text','Town / region')}</div>${textareaField('Social URLs','social_urls',contacts,'One URL per line')}${textareaField('Notes','notes',p?.notes||'','Research you verified, context or relevant detail', 'Keep factual. This is the only prospect research Kyro may use.',3)}<div class="form-grid">${field('Source','source',p?.source||'','text','Referral, public directory…')}${field('Tags','tags',p?.tags?.join(', ')||'','text','local, priority')}</div></form>`;showModal(title,body,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="submit-prospect" data-id="${esc(p?.id||'')}">${p?'Save changes':'Add prospect'}</button>`)}
function parseCsvText(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"'){quoted=true}else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell.replace(/\r$/,''));if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell.replace(/\r$/,''));if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw new Error('The CSV needs a header row and at least one prospect.');const headers=rows.shift().map(x=>x.trim().toLowerCase().replace(/[\s-]+/g,'_'));if(!headers.includes('business_name')||!headers.includes('email'))throw new Error('CSV must include required columns: business_name and email.');return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||''])))}
function importModal(){state.importRows=[];showModal('Import prospects',`<div class="verified-callout" style="margin-bottom:15px">Upload a CSV with <strong>business_name</strong> and <strong>email</strong>. Kyro validates and normalizes every row, detects duplicates, and asks you to review before importing.</div><div class="field"><label for="csv-file">CSV file</label><input id="csv-file" type="file" accept=".csv,text/csv" style="padding:8px"><div class="hint">Optional columns: contact_name, phone, website, industry, location, notes, source, tags</div></div><div id="csv-results"></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" id="csv-import-button" data-action="commit-import" disabled>Import valid rows</button>`,true)}
async function previewCsv(file){try{const rows=parseCsvText(await file.text());state.importRows=rows;const d=await api('/api/import/preview',{method:'POST',body:{rows}});const el=document.getElementById('csv-results');el.innerHTML=`<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0"><div class="provider-card"><div style="font-size:18px">${d.counts.valid}</div><div class="panel-meta">Valid</div></div><div class="provider-card"><div style="font-size:18px">${d.counts.duplicates}</div><div class="panel-meta">Duplicates</div></div><div class="provider-card"><div style="font-size:18px">${d.counts.invalid}</div><div class="panel-meta">Invalid</div></div></div>${d.invalid.length||d.duplicates.length?`<div style="max-height:190px;overflow:auto;border:1px solid #2c3337;border-radius:7px"><table class="data-table" style="min-width:0"><thead><tr><th>Row</th><th>Business / email</th><th>Review result</th></tr></thead><tbody>${[...d.invalid.map(x=>({...x,type:'Invalid'})),...d.duplicates.map(x=>({...x,type:'Duplicate'}))].slice(0,30).map(x=>`<tr><td>${x.row}</td><td>${esc(x.business_name||x.email)}</td><td>${esc(x.reason)}</td></tr>`).join('')}</tbody></table></div>`:''}<p class="hint" style="margin-top:10px">${d.counts.reviewed} rows reviewed. Only ${d.counts.valid} valid, non-duplicate rows can be imported.</p>`;document.getElementById('csv-import-button').disabled=!d.counts.valid}catch(e){toast(e.message,'error');}}
async function commitCsv(){if(!state.importRows.length)return;try{const d=await api('/api/import/commit',{method:'POST',body:{rows:state.importRows}});closeModal();toast(`${d.created} prospects imported`,'success',`${d.duplicates.length} duplicates and ${d.invalid.length} invalid rows were skipped after review.`);state.prospectPage=1;loadProspects()}catch(e){toast(e.message,'error')}}
async function openProspect(id){try{const d=await api('/api/prospects/'+id);const p=d.prospect;const social=(p.social_urls||[]).map(s=>`<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(s)}</a>`).join('<br>')||'—';const drafts=d.drafts||[];const timeline=d.timeline||[];const sends=d.sends||[];const body=`<div class="detail-grid"><div><div class="card"><div class="panel-head"><div><div class="panel-title">Business information</div><div class="panel-meta">${esc(p.business_name)}</div></div>${statusPill(p.status)}</div><div class="detail-info"><div class="detail-field"><label>Contact</label><span>${esc(p.contact_name||'—')}</span></div><div class="detail-field"><label>Email</label><span>${esc(p.email)}</span></div><div class="detail-field"><label>Phone</label><span>${esc(p.phone||'—')}</span></div><div class="detail-field"><label>Industry</label><span>${esc(p.industry||'—')}</span></div><div class="detail-field"><label>Location</label><span>${esc(p.location||'—')}</span></div><div class="detail-field"><label>Website</label><span>${p.website?`<a href="${esc(p.website)}" target="_blank" rel="noopener noreferrer">${esc(p.website)}</a>`:'—'}</span></div><div class="detail-field"><label>Social profiles</label><span>${social}</span></div><div class="detail-field"><label>Source</label><span>${esc(p.source||'—')}</span></div><div class="detail-field" style="grid-column:1/-1"><label>Tags</label><span>${(p.tags||[]).map(t=>`<span class="pill compact">${esc(t)}</span>`).join(' ')||'—'}</span></div><div class="detail-field" style="grid-column:1/-1"><label>Notes</label><span style="white-space:pre-wrap">${esc(p.notes||'No verified notes recorded.')}</span></div></div></div><div class="card" style="margin-top:13px"><div class="panel-head"><div><div class="panel-title">Outreach history</div><div class="panel-meta">Provider status is shown when available</div></div></div>${drafts.length||sends.length?`<div class="panel-body">${sends.map(s=>`<div class="suppression-row"><div><div class="suppression-email">${esc(s.subject)}</div><div class="suppression-meta">${prettyDate(s.sent_at,true)} · ${esc(s.provider_status||s.status)}</div></div>${statusPill(s.status)}</div>`).join('')}${drafts.filter(x=>!sends.some(s=>s.draft_id===x.id)).map(x=>`<div class="suppression-row"><div><div class="suppression-email">${esc(x.subject||'Untitled draft')}</div><div class="suppression-meta">${esc(x.service_focus)} · ${prettyDate(x.updated_at,true)}</div></div>${statusPill(x.status)}</div>`).join('')}</div>`:`<div class="empty" style="padding:22px"><h3>No outreach history</h3><p>Drafts, approvals and sends will appear here.</p></div>`}</div></div><div class="card"><div class="panel-head"><div><div class="panel-title">Timeline</div><div class="panel-meta">Workspace audit history</div></div></div><div class="timeline">${timeline.length?timeline.map(a=>`<div class="timeline-item"><div class="timeline-date">${prettyDate(a.created_at)}</div><div class="timeline-dot"></div><div class="timeline-content">${esc(a.description)}</div></div>`).join(''):`<div class="empty" style="padding:20px"><p>No events recorded yet.</p></div>`}</div></div></div>`;const foot=`<button class="btn subtle" data-action="close-modal">Close</button><button class="btn" data-action="edit-prospect" data-id="${esc(p.id)}">${icon('edit',13)} Edit</button><button class="btn primary" data-action="compose" data-id="${esc(p.id)}">Compose email ${icon('arrow',13)}</button>`;showModal(p.business_name,`${body}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px"><button class="btn small" data-action="mark-status" data-id="${esc(p.id)}" data-status="Interested">Mark Interested</button><button class="btn small" data-action="mark-status" data-id="${esc(p.id)}" data-status="Not Interested">Not Interested</button><button class="btn small" data-action="record-reply" data-id="${esc(p.id)}">Record reply</button><button class="btn small danger" data-action="suppress-prospect" data-id="${esc(p.i ="field"><label for="compose-personal-notes">Personalization notes</label><textarea id="compose-personal-notes" rows="2" placeholder="Internal notes (not included in the email)">${esc(c.notes||'')}</textarea></div><div id="compose-meta" class="panel-meta">${c.draftId?`Draft saved · ${esc(c.draftId.slice(0,8))}`:'Unsaved draft'}${c.approvedAt?' · Approved':''}</div><div class="compose-actions" style="margin-top:15px"><button class="btn" data-action="save-draft" ${c.prospectId?'':'disabled'}>${icon('check',13)} Save draft</button><button class="btn" data-action="approve-draft" ${c.prospectId?'':'disabled'}>Approve</button><button class="btn primary" data-action="schedule-draft" ${c.prospectId?'':'disabled'}>${icon('calendar',13)} Schedule</button></div></section></div></div>`;document.getElementById('compose-prospect')?.addEventListener('change',async e=>{c.prospectId=e.target.value;c.selectedProspect=null;c.draftId='';c.subject='';c.body='';if(c.prospectId){try{const detail=await api('/api/prospects/'+c.prospectId);c.selectedProspect=detail.prospect;if(c.selectedProspect.status==='Suppressed'||c.selectedProspect.status==='Not Interested')toast('This prospect is suppressed or not interested. Sending will be blocked.','error')}catch(err){toast(err.message,'error')}}renderComposePage()});document.getElementById('compose-campaign')?.addEventListener('change',e=>{c.campaignId=e.target.value;const camp=state.campaigns.find(x=>x.id===c.campaignId);if(camp)c.service=camp.service_focus;renderComposePage()});document.getElementById('compose-service')?.addEventListener('change',e=>c.service=e.target.value);document.getElementById('compose-tone')?.addEventListener('change',e=>c.tone=e.target.value);document.getElementById('compose_verified')?.addEventListener('input',e=>c.verified=e.target.value);document.getElementById('compose_notes')?.addEventListener('input',e=>c.notes=e.target.value);document.getElementById('compose-subject')?.addEventListener('input',e=>c.subject=e.target.value);document.getElementById('compose-body')?.addEventListener('input',e=>c.body=e.target.value);document.getElementById('compose-personal-notes')?.addEventListener('input',e=>c.notes=e.target.value)}
async function ensureComposeSaved(){const c=state.compose;if(!c?.prospectId)throw new Error('Select a prospect first.');const subjectEl=document.getElementById('compose-subject'),bodyEl=document.getElementById('compose-body'),notesEl=document.getElementById('compose-personal-notes');if(subjectEl)c.subject=subjectEl.value;if(bodyEl)c.body=bodyEl.value;if(notesEl)c.notes=notesEl.value;if(!c.subject.trim()||!c.body.trim())throw new Error('Add a subject and message before saving.');const d=await api('/api/drafts',{method:'POST',body:{id:c.draftId,prospect_id:c.prospectId,campaign_id:c.campaignId||null,subject:c.subject,body:c.body,personalization_notes:c.notes,service_focus:c.service}});c.draftId=d.draft.id;c.approvedAt=null;return d.draft}
async function composeGenerate(){const c=state.compose;if(!c?.prospectId)throw new Error('Select a prospect first.');const button=document.querySelector('[data-action="generate-draft"]');if(button){button.disabled=true;button.innerHTML=icon('refresh',13)+' Generating…'}try{const d=await api('/api/drafts/generate',{method:'POST',body:{prospect_id:c.prospectId,campaign_id:c.campaignId||null,service_focus:c.service,tone:c.tone,verified_observation:c.verified,personalization_notes:c.notes}});c.draftId=d.draft.id;c.subject=d.draft.subject;c.body=d.draft.body;c.notes=d.draft.personalization_notes;c.approvedAt=null;toast('Grounded draft generated','success','Review every line before approval.');renderComposePage()}finally{if(button)button.disabled=false}}
async function composeSave(){const d=await ensureComposeSaved();toast('Draft saved','success');renderComposePage()}
async function composeApprove(){let c=state.compose;await ensureComposeSaved();await api(`/api/drafts/${c.draftId}/approve`,{method:'POST',body:{}});c.approvedAt=new Date().toISOString();toast('Email approved','success','It still will not send until scheduled or manually sent.');renderComposePage()}
async function composeSchedule(){const c=state.compose;if(!c.prospectId)throw new Error('Select a prospect first.');await ensureComposeSaved();await api(`/api/drafts/${c.draftId}/approve`,{method:'POST',body:{}});c.approvedAt=new Date().toISOString();showScheduleModal(c.draftId)}
function dateTimeLocalDefault(){const now=new Date();let d=new Date(now.getTime()+60*60*1000);const start=state.settings?.agency?.sending_window_start||'09:00';const end=state.settings?.agency?.sending_window_end||'17:00';const [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number);if(d.getHours()<sh||d.getHours()>=eh||d.getHours()*60+d.getMinutes()>=eh*60+em){d.setDate(d.getDate()+1);d.setHours(sh+1,0,0,0)}const pad=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function showScheduleModal(id){const body=`<div class="form-error" id="modal-error"></div><div class="verified-callout" style="margin-bottom:14px">Only an approved draft in an active campaign can be scheduled. Kyro will re-check eligibility, quota and sending window at send time.</div><div class="field"><label for="schedule-at">Send at · your local time (${esc(state.settings?.profile?.timezone||'Africa/Nairobi')})</label><input id="schedule-at" type="datetime-local" value="${dateTimeLocalDefault()}"></div><div style="font-size:10px;color:#7f8a90">Daily ceiling is 10 successful initial + follow-up outreach emails combined.</div>`;showModal('Schedule approved email',body,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="confirm-schedule" data-id="${esc(id)}">Schedule email</button>`)}
async function reviewDraft(id,prospectId){try{let c=state.compose;const detail=await api('/api/prospects/'+prospectId);const d=detail.drafts.find(x=>x.id===id);if(!d){toast('Draft could not be found.','error');return}const camps=await api('/api/campaigns');state.campaigns=camps.items;const plist=await api('/api/prospects?page=1&limit=50');state.compose={prospects:plist.items,selectedProspect:detail.prospect,prospectId:detail.prospect.id,draftId:d.id,campaignId:d.campaign_id||'',subject:d.subject,body:d.body,service:d.service_focus,tone:'Professional',verified:'',notes:d.personalization_notes,approvedAt:d.approved_at};navigate('Compose')}catch(e){toast(e.message,'error')}}
async function loadCampaignOpen(id){try{const c=await api('/api/campaigns/'+id);const p=await api('/api/prospects?page=1&limit=50');const selected=await api('/api/prospects?status=All&page=1&limit=50');const campaign=c.campaign;showModal(campaign.name,`<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">${[['Prospects',campaign.prospects],['Sent',campaign.sent],['Interested',campaign.interested]].map(([l,v])=>`<div class="provider-card"><div style="font-size:18px">${v}</div><div class="panel-meta">${l}</div></div>`).join('')}</div><div class="panel-meta">Service: ${esc(campaign.service_focus)} · ${campaign.daily_limit}/day · ${campaign.follow_up_delay_days} day follow-up · ${esc(campaign.sending_window_start)}–${esc(campaign.sending_window_end)}</div><div style="margin-top:14px;font-size:10px;color:#8d989e">Selected prospect memberships are maintained on the campaign. Add more from the campaign editor when needed.</div>`,`<button class="btn" data-action="close-modal">Close</button><button class="btn primary" data-action="navigate" data-page="Compose">Compose email</button>`)}catch(e){toast(e.message,'error')}}
async function saveSettings(form){const data=Object.fromEntries(new FormData(form).entries());data.follow_up_delay_days=Number(data.follow_up_delay_days);try{state.settings=await api('/api/settings',{method:'PUT',body:data});toast('Settings saved','success');await loadSettings()}catch(e){showFormError('modal-error',e.message);toast(e.message,'error')}}
function showFormError(id,message){const el=document.getElementById(id);if(el){el.textContent=message;el.style.display='block'}}
function confirmDialog(title,message,confirmLabel='Confirm',danger=false,action='confirm') {showModal(title,`<p style="font-size:11px;color:#a5afb4;line-height:1.6;margin:0">${esc(message)}</p>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn ${danger?'danger':'primary'}" data-action="${action}">${esc(confirmLabel)}</button>`)}
function setupConfirmAction(action,payload){window.pendingConfirm={action,...payload}}
async function handleAction(action,btn){const id=btn.dataset.id||'', page=btn.dataset.page||'';try{switch(action){case 'navigate':navigate(page);break;case 'toggle-mobile':state.mobileOpen=!state.mobileOpen;renderShell();renderPage();break;case 'close-mobile':state.mobileOpen=false;renderShell();renderPage();break;case 'reload':boot();break;case 'auth-home':renderAuth();break;case 'auth-login':renderAuth('login');break;case 'auth-setup':renderAuth('setup');break;case 'demo-login':{btn.disabled=true;await api('/api/auth/demo',{method:'POST',body:{}});await boot();break}case 'account-menu':showModal('Account',`<div class="provider-card"><div class="panel-title">${esc(state.boot.user.display_name)}</div><div class="panel-meta">${esc(state.boot.user.email)}</div>${state.boot.user.demo_mode?'<div class="demo-badge" style="margin-top:10px">DEMO MODE</div>':''}</div><p style="font-size:10px;color:#8e989d;line-height:1.6">This workspace is private to your account. Sign out to return to the sign-in screen.</p>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn danger" data-action="logout">Sign out</button>`);break;case 'logout':await api('/api/auth/logout',{method:'POST',body:{}});state.boot.authenticated=false;state.compose=null;closeModal();await boot();break;case 'global-search':navigate('Prospects');setTimeout(()=>document.getElementById('prospect-search')?.focus(),100);break;case 'notifications':{const d=await api('/api/dashboard');const pop=document.createElement('div');pop.className='notice-pop';pop.innerHTML=`<h4>Recent activity</h4>${d.activity.slice(0,4).map(x=>`<p>${esc(x.description)}<br><span style="color:#66727a">${relativeDate(x.created_at)}</span></p>`).join('')||'<p>No new activity.</p>'}<button class="text-link" data-action="activity-log">Open activity log</button>`;document.querySelector('.topbar').appendChild(pop);setTimeout(()=>pop.remove(),7000);break}case 'activity-log':{const d=await api('/api/dashboard');showModal('Recent activity',`<div class="activity-list">${d.activity.map(a=>`<div class="activity-item"><div class="activity-mark">${icon(activityIcon(a.type),13)}</div><div><div class="activity-text">${esc(a.description)}</div><div class="activity-time">${prettyDate(a.created_at,true)}</div></div></div>`).join('')||'<div class="empty"><p>No activity recorded.</p></div>'}</div>`);break}case 'retry-page':renderPage();break;case 'add-prospect':addProspectModal();break;case 'import-csv':importModal();break;case 'close-modal':closeModal();break;case 'open-prospect':openProspect(id);break;case 'submit-prospect':{const form=document.getElementById('prospect-form');const data=Object.fromEntries(new FormData(form).entries());data.tags=data.tags.split(',').map(x=>x.trim()).filter(Boolean);data.social_urls=data.social_urls.split('\n').map(x=>x.trim()).filter(Boolean);const currentId=btn.dataset.id;if(currentId)await api('/api/prospects/'+currentId,{method:'PUT',body:data});else await api('/api/prospects',{method:'POST',body:data});closeModal();toast(currentId?'Prospect updated':'Prospect added','success');loadProspects();break}case 'edit-prospect':{const d=await api('/api/prospects/'+id);closeModal();addProspectModal(d.prospect);break}case 'prospect-page':state.prospectPage=Number(btn.dataset.pageNum);loadProspects();break;case 'row-menu':{const p=state.prospects.find(x=>x.id===id);showModal(p?.business_name||'Prospect actions',`<div style="display:grid;gap:8px"><button class="btn" data-action="open-prospect" data-id="${id}">Open profile</button><button class="btn" data-action="edit-prospect" data-id="${id}">Edit details</button><button class="btn" data-action="compose" data-id="${id}">Compose outreach</button><button class="btn danger" data-action="delete-prospect" data-id="${id}">Delete prospect</button></div>`);break}case 'delete-prospect':closeModal();setupConfirmAction('delete-prospect',{id});confirmDialog('Delete prospect?','This permanently removes the prospect and its associated draft and send history. This action cannot be undone.','Delete prospect',true,'confirm-delete');break;case 'confirm-delete':{const payload=window.pendingConfirm;await api('/api/prospects/'+payload.id,{method:'DELETE',body:{confirm:true}});closeModal();toast('Prospect deleted');loadProspects();break}case 'compose':{closeModal();const d=await api('/api/prospects/'+id);const camps=await api('/api/campaigns');state.campaigns=camps.items;const list=await api('/api/prospects?page=1&limit=50');state.compose={prospects:list.items,selectedProspect:d.prospect,prospectId:id,draftId:'',subject:'',body:'',service:camps.items.find(x=>x.status==='Active')?.service_focus||'Graphic Design',tone:'Professional',verified:'',notes:d.prospect.notes||'',campaignId:camps.items.find(x=>x.status==='Active')?.id||''};navigate('Compose');break}case 'mark-status':{const newStatus=btn.dataset.status;closeModal();if(newStatus==='Not Interested'){setupConfirmAction('mark-status',{id,status:newStatus});confirmDialog('Mark Not Interested?','This stops every pending follow-up and blocks future sends for this prospect.','Mark Not Interested',true,'confirm-status')}else{await api(`/api/prospects/${id}/status`,{method:'POST',body:{status:newStatus}});toast('Prospect marked Interested');openProspect(id)}break}case 'confirm-status':{const p=window.pendingConfirm;await api(`/api/prospects/${p.id}/status`,{method:'POST',body:{status:p.status}});closeModal();toast('Status updated; pending follow-ups stopped');openProspect(p.id);break}case 'record-reply':closeModal();showModal('Record a reply',`<div class="field"><label for="reply-status">Reply status</label><select id="reply-status" class="control" style="width:100%"><option>Replied</option><option>Interested</option><option>Not Interested</option><option>Do Not Contact</option></select></div><div class="field"><label for="reply-note">Optional note</label><textarea id="reply-note" rows="3" placeholder="Short internal summary"></textarea></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="submit-reply" data-id="${id}">Record reply</button>`);break;case 'submit-reply':{const status=document.getElementById('reply-status').value;const note=document.getElementById('reply-note').value;await api(`/api/prospects/${id}/reply`,{method:'POST',body:{status,note}});closeModal();toast('Reply recorded','success','Pending follow-ups have been stopped.');if(state.page==='Prospects')loadProspects();break}case 'suppress-prospect':closeModal();setupConfirmAction('suppress',{id});confirmDialog('Suppress this prospect?','The normalized email will be added to the workspace suppression list and all pending follow-ups will stop. This takes priority over every campaign.','Suppress prospect',true,'confirm-suppress');break;case 'confirm-suppress':{const p=window.pendingConfirm;await api(`/api/prospects/${p.id}/suppress`,{method:'POST',body:{reason:'Do not contact requested / manually suppressed'}});closeModal();toast('Prospect suppressed','success','All send paths will now block this address.');if(state.page==='Prospects')loadProspects();break}case 'create-campaign':await createCampaignModal();break;case 'submit-campaign':{const form=document.getElementById('campaign-form');const data=Object.fromEntries(new FormData(form).entries());data.prospect_ids=Array.from(document.getElementById('f-prospects').selectedOptions).map(x=>x.value);data.daily_limit=Number(data.daily_limit);data.follow_up_delay_days=Number(data.follow_up_delay_days);await api('/api/campaigns',{method:'POST',body:data});closeModal();toast('Campaign created','success','Activate it when you are ready.');loadCampaigns();break}case 'campaign-status':{const status=btn.dataset.status;const payload={status};if(status==='Completed'){setupConfirmAction('campaign-status',{id,status});confirmDialog('Complete this campaign?','Scheduled sends will remain blocked while the campaign is completed.','Complete campaign',true,'confirm-campaign-status')}else{await api(`/api/campaigns/${id}/status`,{method:'POST',body:payload});toast(`Campaign ${status.toLowerCase()}`);loadCampaigns()}break}case 'confirm-campaign-status':{const p=window.pendingConfirm;await api(`/api/campaigns/${p.id}/status`,{method:'POST',body:{status:p.status,confirm:true}});closeModal();toast('Campaign completed');loadCampaigns();break}case 'campaign-prospects':loadCampaignOpen(id);break;case 'generate-draft':case 'regenerate-draft':await composeGenerate();break;case 'save-draft':await composeSave();break;case 'approve-draft':await composeApprove();break;case 'schedule-draft':await composeSchedule();break;case 'confirm-schedule':{const value=document.getElementById('schedule-at').value;if(!value)throw new Error('Choose a scheduled time.');await api(`/api/drafts/${id}/schedule`,{method:'POST',body:{scheduled_for:new Date(value).toISOString()}});closeModal();toast('Email scheduled','success','Quota and eligibility are re-checked at send time.');state.compose=null;state.page='Queue';renderShell();loadQueue();break}case 'approve-queue':await api(`/api/drafts/${id}/approve`,{method:'POST',body:{}});toast('Email approved','success','It can now be scheduled or sent subject to all safeguards.');loadQueue();break;case 'schedule-queue':showScheduleModal(id);break;case 'send-now':setupConfirmAction('send-now',{id});confirmDialog(state.boot?.user?.demo_mode?'Simulate this demo send?':'Send this approved email now?',state.boot?.user?.demo_mode?'DEMO MODE: Kyro will simulate this send locally. No email will be delivered. The demo quota counter will update.':'This sends immediately only if approval, active campaign, sending window, suppression, duplicate, reply and quota checks all pass.','Send now',true,'confirm-send-now');break;case 'confirm-send-now':{const p=window.pendingConfirm;const result=await api(`/api/drafts/${p.id}/send`,{method:'POST',body:{confirm:true}});closeModal();toast(state.boot?.user?.demo_mode?'Demo send simulated — not delivered':'Email accepted by provider','success',`Daily counter: ${result.quota_count??'updated'} / 10`);loadQueue();break}case 'pause-queue':setupConfirmAction('pause-queue',{id});confirmDialog('Pause scheduled email?','This removes the email from active scheduling. It will not send unless reviewed and scheduled again.','Pause email',false,'confirm-pause-queue');break;case 'confirm-pause-queue':{const p=window.pendingConfirm;await api(`/api/drafts/${p.id}/pause`,{method:'POST',body:{confirm:true}});closeModal();toast('Email paused');loadQueue();break}case 'cancel-queue':setupConfirmAction('cancel-queue',{id});confirmDialog('Cancel this email?','The scheduled email will be cancelled and will not be sent. This change requires a new draft to resume.','Cancel email',true,'confirm-cancel-queue');break;case 'confirm-cancel-queue':{const p=window.pendingConfirm;await api(`/api/drafts/${p.id}/cancel`,{method:'POST',body:{confirm:true}});closeModal();toast('Email cancelled');loadQueue();break}case 'review-draft':await reviewDraft(id,btn.dataset.prospect);break;case 'commit-import':await commitCsv();break;case 'add-suppression':{const email=document.getElementById('suppress-email').value;setupConfirmAction('add-suppression',{email});confirmDialog('Add suppression entry?','This address will be blocked from all outreach paths.','Add suppression',true,'confirm-add-suppression');break}case 'confirm-add-suppression':{const p=window.pendingConfirm;await api('/api/suppressions',{method:'POST',body:{email:p.email,reason:'Manually added to suppression list'}});toast('Address suppressed');loadSettings();break}case 'remove-suppression':setupConfirmAction('remove-suppression',{id});confirmDialog('Remove suppression?','Future emails to this address will no longer be blocked by this entry. Confirm only if the contact has explicitly opted back in.','Remove entry',true,'confirm-remove-suppression');break;case 'confirm-remove-suppression':{const p=window.pendingConfirm;await api('/api/suppressions/'+p.id,{method:'DELETE',body:{confirm:true}});toast('Suppression removed');loadSettings();break}case 'test-send':setupConfirmAction('test-send',{});confirmDialog('Send provider test email?','This sends a clearly labelled [KYRO TEST] message only to the configured test recipient. It does not count toward the outreach quota.','Send test',false,'confirm-test-send');break;case 'confirm-test-send':{const b=btn;btn.disabled=true;await api('/api/settings/test-send',{method:'POST',body:{}});closeModal();toast('Test email sent','success','No outreach quota was used.');break}default:break}}catch(e){if(document.getElementById('modal-error'))showFormError('modal-error',e.message);else toast(e.message,'error',e.code==='quota_reached'?'Daily counter unchanged for a failed or blocked send.':'')}}
document.addEventListener('click',e=>{const pageLink=e.target.closest('[data-page]');if(pageLink&&pageLink.tagName==='A'){e.preventDefault();navigate(pageLink.dataset.page);return}const btn=e.target.closest('[data-action]');if(!btn)return;if(btn.dataset.action==='compose'&&state.page==='Compose')return;handleAction(btn.dataset.action,btn)});
document.addEventListener('change',e=>{if(e.target.id==='csv-file'&&e.target.files?.[0])previewCsv(e.target.files[0])});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.id==='login-form'||f.id==='setup-form'){try{const data=Object.fromEntries(new FormData(f).entries());await api(f.id==='login-form'?'/api/auth/login':'/api/auth/setup',{method:'POST',body:data});await boot()}catch(err){showFormError('auth-error',err.message)}}else if(f.id==='prospect-form'){const btn=document.querySelector('[data-action="submit-prospect"]');if(btn)handleAction('submit-prospect',btn)}else if(f.id==='campaign-form'){const btn=document.querySelector('[data-action="submit-campaign"]');if(btn)handleAction('submit-campaign',btn)}else if(f.id==='settings-form')saveSettings(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.querySelector('.notice-pop')?.remove()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();handleAction('global-search',document.body)}});
boot();
</script>
