<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090c">
<title>Kyro — Client Acquisition OS</title>
<style>
:root{--bg:#07090c;--panel:#0d1117;--panel2:#11161d;--line:#202832;--line2:#182029;--text:#f5f7fa;--muted:#84909d;--soft:#b8c1cb;--blue:#6ea8ff;--blue2:#3d7df0;--green:#69d59a;--amber:#e6b866;--red:#ef7777;--r:14px;--side:238px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-size:13px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:inherit;text-decoration:none}
.shell{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:#090c10;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;z-index:30}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 30px}.logo{width:30px;height:30px;border-radius:10px;border:1px solid #354150;background:linear-gradient(145deg,#1b2736,#0e141c);display:grid;place-items:center;font-weight:800;position:relative}.logo:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--blue);right:3px;top:3px;box-shadow:0 0 14px #6ea8ff}.brand strong{font-size:15px}.brand small{display:block;color:#65717d;font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-top:3px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#7e8a96;text-align:left;padding:10px 11px;border-radius:9px;display:flex;gap:11px;align-items:center}.nav button:hover{background:#121820;color:#dce4ec}.nav button.active{background:#141c25;color:#f4f7fa}.nav button.active i{color:var(--blue)}.nav i{width:18px;font-style:normal;text-align:center;color:#687480}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:15px 9px 0;color:#7c8894;font-size:10px}.status{display:flex;align-items:center;gap:7px;margin-bottom:13px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #69d59a12}.workspace{display:flex;gap:9px;align-items:center}.avatar{width:30px;height:30px;border-radius:9px;background:#1b2530;border:1px solid #2c3946;display:grid;place-items:center;color:#d9e4ee;font-weight:700;font-size:10px}.workspace b{display:block;color:#cfd7df;font-size:11px}.workspace span{font-size:9px;color:#64707b}
.main{margin-left:var(--side);min-height:100vh}.top{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 30px;position:sticky;top:0;background:#080b0fcc;backdrop-filter:blur(15px);z-index:20}.crumb{font-size:12px;color:#aab4be}.topfill{flex:1}.demo{border:1px solid #735f32;background:#2b2414;color:#e4c77d;border-radius:7px;padding:6px 9px;font-size:9px;font-weight:700;letter-spacing:.1em}.mobile{display:none}
.wrap{max-width:1450px;margin:auto;padding:32px 34px 55px}.hero{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:24px}.eyebrow{color:#6e7b88;font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;margin-bottom:9px}.hero h1{font-size:29px;letter-spacing:-.045em;margin:0}.hero p{color:#87929d;margin:8px 0 0;max-width:650px;line-height:1.55;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #2b3641;background:#11171e;color:#d8e0e7;border-radius:8px;padding:9px 12px;font-size:10px;font-weight:650}.btn:hover{border-color:#455363;background:#18212a}.btn.primary{background:#397fe8;border-color:#4b91f6;color:#fff}.btn.green{background:#17432d;border-color:#276d49;color:#9ce0b9}.btn.danger{background:#32191c;border-color:#653036;color:#f0a3a3}.btn.ghost{background:transparent;border-color:transparent}.grid{display:grid;gap:13px}.stats{grid-template-columns:repeat(5,1fr);margin-bottom:14px}.card{background:linear-gradient(180deg,#0e1319,#0b0f14);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.stat{padding:16px;min-height:93px}.label{color:#71808d;font-size:9px;text-transform:uppercase;letter-spacing:.1em}.value{font-size:25px;font-weight:650;letter-spacing:-.05em;margin-top:14px}.note{color:#65727e;font-size:9px;margin-top:4px}.blue{color:var(--blue)}.layout{grid-template-columns:1.5fr .85fr;align-items:start}.cardhead{padding:15px 17px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:10px}.cardhead h2{font-size:12px;margin:0}.cardhead span{color:#687580;font-size:9px}.body{padding:16px}.meter{display:grid;grid-template-columns:1fr auto;gap:8px 16px}.meter strong{font-size:11px}.track{height:7px;background:#1c252e;border-radius:99px;overflow:hidden;grid-column:1/-1}.fill{height:100%;background:linear-gradient(90deg,#397fe8,#7cb5ff);border-radius:99px}.funnel{display:grid;gap:13px}.frow{display:grid;grid-template-columns:70px 1fr 30px;gap:10px;align-items:center;color:#8995a0;font-size:9px}.fbar{height:5px;background:#1b232c;border-radius:99px;overflow:hidden}.fbar span{display:block;height:100%;background:#4f8fe8}.fcount{text-align:right;color:#d0d7de}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#64717d;font-size:8px;text-transform:uppercase;letter-spacing:.1em;padding:10px 13px;border-bottom:1px solid var(--line2)}.table td{padding:12px 13px;border-bottom:1px solid #151c23;color:#bac4ce;font-size:10px}.table tr:hover td{background:#11171e}.business{color:#edf1f4!important;font-weight:650}.sub{display:block;color:#697681;font-size:9px;margin-top:3px}.pill{display:inline-flex;padding:4px 7px;border-radius:99px;font-size:8px;border:1px solid #2c3741;color:#aeb8c1}.pill.green{color:#8edbad;border-color:#285a42;background:#13251b}.pill.blue{color:#8dbaf2;border-color:#294b70;background:#111e2d}.pill.amber{color:#e2c17b;border-color:#5b4a28;background:#211c11}.pill.red{color:#ed9999;border-color:#5c3033;background:#251417}.empty{padding:35px 20px;text-align:center;color:#7c8893}.empty b{display:block;color:#d9e0e6;font-size:12px;margin-bottom:5px}.empty p{font-size:10px;line-height:1.6;max-width:330px;margin:0 auto 13px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.input,.select,.textarea{height:35px;background:#0a0e13;border:1px solid #29333e;border-radius:8px;color:#e9eef2;padding:0 10px;font-size:10px}.textarea{height:auto;min-height:110px;padding:10px;resize:vertical;line-height:1.55}.search{width:260px}.grow{flex:1}.section{display:none}.section.active{display:block}.cards3{grid-template-columns:repeat(3,1fr)}.campaign{padding:16px}.campaign h3{font-size:13px;margin:0}.campaign .service{font-size:9px;color:#75828e;margin-top:5px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line2);margin:15px 0;padding:12px 0;gap:8px}.metrics strong{display:block;font-size:14px}.metrics span{font-size:8px;color:#6c7884}.campfoot{display:flex;justify-content:space-between;align-items:center}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.field{margin-bottom:13px}.field label{display:block;color:#9ca7b1;font-size:9px;margin-bottom:6px}.field.full{grid-column:1/-1}.field .input,.field .select,.field .textarea{width:100%}.lab{display:grid;grid-template-columns:1fr 1.1fr;gap:14px}.editor{min-height:310px!important}.preview{white-space:pre-wrap;color:#cbd3db;line-height:1.7;font-size:11px;background:#090d12;border:1px solid #202a34;border-radius:9px;padding:15px;min-height:310px}.chart{padding:16px}.bars{height:230px;display:flex;align-items:end;gap:4px;border-bottom:1px solid #26303a;padding:0 3px}.barwrap{flex:1;height:100%;display:flex;align-items:end;position:relative}.bar{width:100%;background:linear-gradient(180deg,#6ea8ff,#2f6fd8);border-radius:4px 4px 0 0;min-height:2px}.barwrap:hover .tip{display:block}.tip{display:none;position:absolute;bottom:calc(var(--h) + 7px);left:50%;transform:translateX(-50%);background:#1a222b;border:1px solid #34404c;padding:5px 7px;border-radius:5px;font-size:8px;white-space:nowrap}.axis{display:flex;justify-content:space-between;color:#64717d;font-size:8px;margin-top:7px}.modalbg{position:fixed;inset:0;background:#000b;z-index:80;display:grid;place-items:center;padding:18px}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0e141b;border:1px solid #2b3641;border-radius:14px;box-shadow:0 30px 100px #000b}.modalhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modalhead h2{margin:0;font-size:14px}.modalbody{padding:18px}.modalfoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.x{background:none;border:0;color:#7e8a95;font-size:20px}.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#17202a;border:1px solid #364452;border-radius:9px;padding:12px 14px;color:#e0e7ed;font-size:10px;box-shadow:0 15px 45px #0008}.toast.err{border-color:#63353b}.hide{display:none!important}
@media(max-width:1000px){:root{--side:0px}.side{transform:translateX(-100%)}.side.open{transform:none}.mobile{display:block;background:none;border:0;color:#aab5bf;margin-right:10px}.stats{grid-template-columns:repeat(2,1fr)}.layout,.lab{grid-template-columns:1fr}.cards3{grid-template-columns:1fr 1fr}.wrap{padding:25px 18px}.top{padding:0 18px}}
@media(max-width:620px){.stats,.cards3{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.hero h1{font-size:24px}.search{width:100%}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.table th:nth-child(3),.table td:nth-child(3){display:none}}
</style>
</head>
<body>
<div id="app"><div class="empty" style="padding-top:18vh"><b>Loading Kyro</b><p>Connecting to your workspace…</p></div></div>
<script>
const S={page:'overview',boot:null,data:{},modal:null,toast:null};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
async function api(path,opt={}){const o={credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}};if(opt.body&&typeof opt.body!=='string')o.body=JSON.stringify(opt.body);if(S.boot?.csrf)o.headers['X-Kyro-CSRF']=S.boot.csrf;const r=await fetch(path,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('Request failed ('+r.status+')'));return d}
function toast(msg,err=false){const n=document.createElement('div');n.className='toast'+(err?' err':'');n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),3200)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pill(v){let c=/sent|interested|active|approved/i.test(v)?'green':/replied|scheduled|contacted/i.test(v)?'blue':/failed|suppressed|not interested|cancelled/i.test(v)?'red':'amber';return '<span class="pill '+c+'">'+esc(v)+'</span>'}
function shell(){const p=S.page;return '<div class="shell"><aside class="side" id="side"><div class="brand"><div class="logo">K</div><div><strong>Kyro</strong><small>Client Acquisition OS</small></div></div><nav class="nav">'+nav('overview','⌂','Overview')+nav('pipeline','◌','Pipeline')+nav('campaigns','◇','Campaigns')+nav('lab','✦','Message Lab')+nav('queue','◷','Queue')+nav('insights','▥','Insights')+nav('workspace','⚙','Workspace')+'</nav><div class="sidefoot"><div class="status"><i class="dot"></i> Workspace operational</div><div class="workspace"><div class="avatar">'+esc((S.boot?.user?.display_name||'G').slice(0,2).toUpperCase())+'</div><div><b>'+esc(S.boot?.user?.display_name||'Workspace')+'</b><span>Kcreatives</span></div></div></div></aside><main class="main"><header class="top"><button class="mobile" onclick="$('#side').classList.toggle('open')">☰</button><span class="crumb">'+title()+'</span><span class="topfill"></span>'+(S.boot?.user?.demo_mode?'<span class="demo">DEMO MODE</span>':'')+'</header><div class="wrap">'+content()+'</div></main></div><div id="modal"></div>'}
function nav(id,ico,label){return '<button class="'+(S.page===id?'active':'')+'" onclick="go(\''+id+'\')"><i>'+ico+'</i>'+label+'</button>'}
function title(){return ({overview:'Command Center',pipeline:'Prospect Pipeline',campaigns:'Campaigns',lab:'Message Lab',queue:'Send Queue',insights:'Performance',workspace:'Workspace'})[S.page]}
function stat(label,val,note,cls=''){return '<div class="card stat"><div class="label">'+label+'</div><div class="value '+cls+'">'+val+'</div><div class="note">'+note+'</div></div>'}
function content(){if(S.page==='overview')return overview();if(S.page==='pipeline')return pipeline();if(S.page==='campaigns')return campaigns();if(S.page==='lab')return lab();if(S.page==='queue')return queue();if(S.page==='insights')return insights();return workspace()}
function head(kicker,h,sub,buttons=''){return '<div class="hero"><div><div class="eyebrow">'+kicker+'</div><h1>'+h+'</h1><p>'+sub+'</p></div><div class="actions">'+buttons+'</div></div>'}
function overview(){const d=S.data.dashboard||{};return head('KYRO / COMMAND CENTER','Build a pipeline. Start conversations.','One focused workspace for prospects, campaigns, approved messages and measurable client acquisition.','<button class="btn primary" onclick="go(\'pipeline\');openLead()">+ Add prospect</button>')+'<div class="grid stats">'+stat('Prospects',d.prospects||0,'active pipeline')+stat('Sent today',(d.sent_today||0)+' / '+(d.daily_limit||10),'daily outreach ceiling','blue')+stat('Replies',d.replies||0,'recorded responses')+stat('Interested',d.interested||0,'positive intent','blue')+stat('Follow-ups due',d.followups_due||0,'needs attention')+'</div><div class="grid layout"><div class="grid"><div class="card"><div class="cardhead"><div><h2>Acquisition funnel</h2><span>Recorded workspace activity</span></div><button class="btn" onclick="go(\'insights\')">View insights</button></div><div class="body"><div class="funnel">'+frow('Prospects',d.funnel?.prospects||0,d.funnel?.prospects||1)+frow('Approved',d.funnel?.approved||0,d.funnel?.prospects||1)+frow('Sent',d.funnel?.sent||0,d.funnel?.prospects||1)+frow('Replies',d.funnel?.replies||0,d.funnel?.sent||1)+frow('Interested',d.funnel?.interested||0,d.funnel?.sent||1)+'</div></div></div><div class="card"><div class="cardhead"><div><h2>Today's queue</h2><span>Scheduled work</span></div><button class="btn" onclick="go(\'queue\')">Open queue</button></div>'+queueRows(d.queue||[])+'</div></div><div class="grid"><div class="card"><div class="cardhead"><div><h2>Daily capacity</h2><span>Hard safety ceiling</span></div></div><div class="body"><div class="meter"><strong>'+(d.sent_today||0)+' of '+(d.daily_limit||10)+' sends used</strong><span class="label">'+(d.remaining||0)+' left</span><div class="track"><div class="fill" style="width:'+Math.min(100,((d.sent_today||0)/(d.daily_limit||10))*100)+'%"></div></div></div></div></div><div class="card"><div class="cardhead"><div><h2>Recent activity</h2><span>Latest workspace events</span></div></div><div class="body">'+activity(d.activity||[])+'</div></div></div></div>'}
function frow(name,n,max){return '<div class="frow"><span>'+name+'</span><div class="fbar"><span style="width:'+Math.min(100,(n/Math.max(1,max))*100)+'%"></span></div><b class="fcount">'+n+'</b></div>'}
function activity(a){if(!a.length)return '<div class="empty"><b>No activity yet</b><p>Your workspace events will appear here.</p></div>';return a.map(x=>'<div style="padding:9px 0;border-bottom:1px solid #151c23"><div style="font-size:10px;color:#cdd5dc">'+esc(x.description||'Activity recorded')+'</div><div class="sub">'+fmt(x.created_at)+'</div></div>').join('')}
function queueRows(a){if(!a.length)return '<div class="empty"><b>Queue is clear</b><p>No scheduled messages for today.</p></div>';return '<div class="tablewrap"><table class="table"><tbody>'+a.map(x=>'<tr><td><span class="business">'+esc(x.business_name)+'</span><span class="sub">'+esc(x.email)+'</span></td><td>'+esc(x.subject)+'</td><td>'+fmt(x.scheduled_for)+'</td><td>'+pill(x.status)+'</td></tr>').join('')+'</tbody></table></div>'}
async function loadDashboard(){S.data.dashboard=await api('/api/dashboard')}
async function pipeline(){const q=S.data.prospects||{items:[]};return head('KYRO / PIPELINE','Prospects, without the spreadsheet.','Keep the next best conversation visible and every contact scoped to one workspace.','<button class="btn" onclick="importCsv()">Import CSV</button><button class="btn primary" onclick="openLead()">+ Add prospect</button>')+'<div class="toolbar"><input class="input search" id="ps" placeholder="Search business, person or email" value="'+esc(S.data.q||'')+'" onkeydown="if(event.key===\'Enter\'){S.data.q=this.value;loadPage()}"><select class="select" onchange="S.data.status=this.value;loadPage()"><option>All</option>'+['New','Contacted','Replied','Interested','Not Interested','Suppressed'].map(x=>'<option '+((S.data.status||'All')===x?'selected':'')+'>'+x+'</option>').join('')+'</select><span class="grow"></span><span class="label">'+(q.total||0)+' records</span></div><div class="card tablewrap"><table class="table"><thead><tr><th>Business</th><th>Contact</th><th>Location</th><th>Status</th><th>Next move</th></tr></thead><tbody>'+(q.items||[]).map(x=>'<tr onclick="openProspect(\''+x.id+'\')" style="cursor:pointer"><td><span class="business">'+esc(x.business_name)+'</span><span class="sub">'+esc(x.industry||'')+'</span></td><td>'+esc(x.contact_name||'—')+'<span class="sub">'+esc(x.email)+'</span></td><td>'+esc(x.location||'—')+'</td><td>'+pill(x.status)+'</td><td><button class="btn" onclick="event.stopPropagation();quickDraft(\''+x.id+'\')">Draft message</button></td></tr>').join('')+'</tbody></table></div>'}
async function loadProspects(){S.data.prospects=await api('/api/prospects?q='+encodeURIComponent(S.data.q||'')+'&status='+encodeURIComponent(S.data.status||'All')+'&limit=50')}
async function campaigns(){const c=S.data.campaigns||{items:[]};return head('KYRO / CAMPAIGNS','Sequences with a purpose.','Turn a segment of prospects into a controlled outreach motion. Every campaign stays inside the workspace’s daily ceiling.','<button class="btn primary" onclick="openCampaign()">+ New campaign</button>')+'<div class="grid cards3">'+(c.items||[]).map(x=>'<div class="card campaign"><div style="display:flex;justify-content:space-between;gap:8px"><div><h3>'+esc(x.name)+'</h3><div class="service">'+esc(x.service_focus)+'</div></div>'+pill(x.status)+'</div><div class="metrics"><div><strong>'+x.prospects+'</strong><span>prospects</span></div><div><strong>'+x.sent+'</strong><span>sent</span></div><div><strong>'+x.replies+'</strong><span>replies</span></div><div><strong>'+x.interested+'</strong><span>interested</span></div></div><div class="campfoot"><span class="sub">'+x.remaining+' remaining · '+x.daily_limit+'/day</span><button class="btn" onclick="toggleCampaign(\''+x.id+'\',\''+(x.status==='Active'?'Paused':'Active')+'\')">'+(x.status==='Active'?'Pause':'Activate')+'</button></div></div>').join('')+'</div>'+(c.items?.length?'':'<div class="card empty"><b>No campaigns yet</b><p>Create a campaign, select prospects and start building approved messages.</p><button class="btn primary" onclick="openCampaign()">Create your first campaign</button></div>')}
async function loadCampaigns(){S.data.campaigns=await api('/api/campaigns')}
async function lab(){const p=S.data.prospects?.items||[];const c=S.data.campaigns?.items||[];const d=S.data.draft||{};return head('KYRO / MESSAGE LAB','Write less. Research better.','Generate a grounded first draft from the record and your verified observation. Nothing sends automatically.','')+'<div class="grid lab"><div class="card"><div class="cardhead"><h2>Draft controls</h2></div><div class="body"><div class="field"><label>PROSPECT</label><select class="select" style="width:100%" id="lp"><option value="">Choose a prospect</option>'+p.map(x=>'<option value="'+x.id+'" '+(d.prospect_id===x.id?'selected':'')+'>'+esc(x.business_name)+' — '+esc(x.contact_name||x.email)+'</option>').join('')+'</select></div><div class="field"><label>CAMPAIGN</label><select class="select" style="width:100%" id="lc"><option value="">No campaign</option>'+c.map(x=>'<option value="'+x.id+'" '+(d.campaign_id===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>SERVICE</label><select class="select" style="width:100%" id="ls">'+['Graphic Design','Branding','Meta Ads','TikTok Ads'].map(x=>'<option '+(x===d.service_focus?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>TONE</label><select class="select" style="width:100%" id="lt"><option>Professional</option><option>Friendly</option><option>Direct</option><option>Minimal</option></select></div><div class="field"><label>VERIFIED OBSERVATION</label><textarea class="textarea" id="lo" placeholder="Only add something you have actually verified about the prospect.">'+esc(d.observation||'')+'</textarea></div><button class="btn primary" style="width:100%" onclick="generateDraft()">Generate grounded draft</button></div></div><div class="card"><div class="cardhead"><div><h2>Message</h2><span>Review before approval</span></div>'+ (d.id?pill(d.status):'')+'</div><div class="body">'+(d.id?'<div class="field"><label>SUBJECT</label><input class="input" style="width:100%" id="ds" value="'+esc(d.subject)+'"></div><div class="field"><label>BODY</label><textarea class="textarea editor" id="db">'+esc(d.body)+'</textarea></div><div class="actions"><button class="btn" onclick="saveDraft()">Save</button><button class="btn green" onclick="approveDraft()">Approve</button>'+(d.status==='Approved'?'<button class="btn primary" onclick="scheduleDraft()">Schedule</button>':'')+'</div>':'<div class="empty"><b>Your message appears here</b><p>Choose a prospect, add an optional verified observation, then generate a draft.</p></div>')+'</div></div></div>'}
async function loadLab(){if(!S.data.prospects)await loadProspects();if(!S.data.campaigns)await loadCampaigns()}
async function queue(){const q=S.data.queue||{items:[]};return head('KYRO / QUEUE','The work that is allowed to leave.','Approved messages, scheduled sends and follow-ups in one controlled lane.','<button class="btn" onclick="loadPage()">Refresh</button>')+'<div class="card tablewrap"><table class="table"><thead><tr><th>Prospect</th><th>Subject</th><th>Campaign</th><th>When</th><th>Status</th><th></th></tr></thead><tbody>'+(q.items||[]).map(x=>'<tr><td><span class="business">'+esc(x.business_name)+'</span><span class="sub">'+esc(x.email)+'</span></td><td>'+esc(x.subject)+'</td><td>'+esc(x.campaign_name||'—')+'</td><td>'+fmt(x.scheduled_for)+'</td><td>'+pill(x.status)+'</td><td><button class="btn" onclick="sendNow(\''+x.id+'\')">Send now</button></td></tr>').join('')+'</tbody></table></div>'+(q.items?.length?'':'<div class="card empty"><b>Nothing in the queue</b><p>Approved messages will appear here once scheduled.</p></div>')}
async function loadQueue(){S.data.queue=await api('/api/queue')}
async function insights(){const a=S.data.analytics||{};return head('KYRO / INSIGHTS','Know what is working.','Thirty days of recorded activity. No fabricated opens, clicks or delivery numbers.','<button class="btn" onclick="loadPage()">Refresh</button>')+'<div class="grid stats">'+stat('Emails sent',a.emails_sent||0,'recorded sends','blue')+stat('Reply rate',(a.reply_rate||0)+'%','replies / sent')+stat('Interest rate',(a.interest_rate||0)+'%','interested / sent','blue')+stat('Failed sends',a.failed_sends||0,'provider failures')+stat('Suppressed',a.suppressed||0,'do-not-contact records')+'</div><div class="card"><div class="cardhead"><div><h2>Daily sends</h2><span>Last 30 days</span></div></div><div class="chart">'+bars(a.daily||[])+'</div></div><div class="grid layout" style="margin-top:13px"><div class="card"><div class="cardhead"><h2>Service performance</h2></div><div class="tablewrap"><table class="table"><thead><tr><th>Service</th><th>Sent</th><th>Replies</th><th>Interested</th></tr></thead><tbody>'+(a.service_performance||[]).map(x=>'<tr><td class="business">'+esc(x.service)+'</td><td>'+x.sent+'</td><td>'+x.replies+'</td><td>'+x.interested+'</td></tr>').join('')+'</tbody></table></div></div><div class="card"><div class="cardhead"><h2>Operating rules</h2></div><div class="body"><div class="sub" style="line-height:1.8;color:#9aa5af">• Global ceiling: 10 successful outreach sends/day.<br>• Approval is required before scheduling.<br>• Replies and suppression stop further outreach.<br>• Demo sends are simulated, never delivered.<br>• Analytics reflect app-recorded events only.</div></div></div></div>'}
async function loadInsights(){S.data.analytics=await api('/api/analytics')}
function bars(d){const max=Math.max(1,...d.map(x=>x.sent||0));return '<div class="bars">'+d.map(x=>'<div class="barwrap" style="--h:'+((x.sent||0)/max*100)+'%"><div class="tip">'+x.date+': '+x.sent+'</div><div class="bar" style="height:'+Math.max(1,(x.sent||0)/max*100)+'%"></div></div>').join('')+'</div><div class="axis"><span>'+((d[0]||{}).date||'')+'</span><span>'+((d[Math.floor(d.length/2)]||{}).date||'')+'</span><span>'+((d[d.length-1]||{}).date||'')+'</span></div>'}
async function workspace(){const s=S.data.settings||{};const p=s.profile||{};const a=s.agency||{};return head('KYRO / WORKSPACE','Make the system yours.','Sender identity, sending window and operating context for Kcreatives.','<button class="btn primary" onclick="saveSettings()">Save changes</button>')+'<div class="grid layout"><div class="card"><div class="body"><div class="formgrid"><div class="field"><label>DISPLAY NAME</label><input class="input" id="wname" value="'+esc(p.sender_name||'')+'"></div><div class="field"><label>SENDER EMAIL</label><input class="input" id="wemail" value="'+esc(p.sender_email||'')+'"></div><div class="field"><label>REPLY-TO</label><input class="input" id="wreply" value="'+esc(p.reply_to||'')+'"></div><div class="field"><label>TIMEZONE</label><input class="input" id="wtz" value="'+esc(p.timezone||'Africa/Nairobi')+'"></div><div class="field"><label>AGENCY</label><input class="input" id="wagency" value="'+esc(a.agency_name||'Kcreatives')+'"></div><div class="field"><label>TAGLINE</label><input class="input" id="wtag" value="'+esc(a.tagline||'Design. Strategy. Growth.')+'"></div><div class="field full"><label>DESCRIPTION</label><textarea class="textarea" id="wdesc">'+esc(a.description||'')+'</textarea></div><div class="field"><label>SENDING START</label><input class="input" id="ws" value="'+esc(a.sending_window_start||'09:00')+'"></div><div class="field"><label>SENDING END</label><input class="input" id="we" value="'+esc(a.sending_window_end||'17:00')+'"></div></div></div></div><div class="grid"><div class="card"><div class="cardhead"><h2>Provider</h2></div><div class="body"><div class="label">STATUS</div><div style="margin-top:7px">'+pill(s.provider?.connected?'Connected':'Not connected')+'</div><div class="sub" style="margin-top:10px">Live sending is optional. Demo mode never delivers email.</div></div></div><div class="card"><div class="cardhead"><h2>Workspace guardrails</h2></div><div class="body"><div class="sub" style="line-height:1.9">Daily hard ceiling: <b style="color:#dce4eb">10</b><br>Timezone: <b style="color:#dce4eb">'+esc(p.timezone||'Africa/Nairobi')+'</b><br>Follow-up default: <b style="color:#dce4eb">'+esc(a.follow_up_delay_days||4)+' days</b></div></div></div></div></div>'}
async function loadSettings(){S.data.settings=await api('/api/settings')}
async function go(page){S.page=page;$('#side')?.classList.remove('open');await loadPage()}
async function loadPage(){try{if(S.page==='overview')await loadDashboard();if(S.page==='pipeline')await loadProspects();if(S.page==='campaigns')await loadCampaigns();if(S.page==='lab')await loadLab();if(S.page==='queue')await loadQueue();if(S.page==='insights')await loadInsights();if(S.page==='workspace')await loadSettings();render()}catch(e){toast(e.message,true)}}
function render(){const old=$('#app');old.innerHTML=shell();if(S.modal)renderModal()}
function openModal(title,body,foot){S.modal={title,body,foot};renderModal()}
function renderModal(){const m=$('#modal');if(!S.modal){m.innerHTML='';return}m.innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>'+S.modal.title+'</h2><button class="x" onclick="closeModal()">×</button></div><div class="modalbody">'+S.modal.body+'</div><div class="modalfoot">'+S.modal.foot+'</div></div></div>'}
function closeModal(){S.modal=null;render()}
function openLead(){openModal('Add prospect','<div class="formgrid"><div class="field"><label>BUSINESS NAME</label><input class="input" id="nb"></div><div class="field"><label>CONTACT NAME</label><input class="input" id="nc"></div><div class="field"><label>EMAIL</label><input class="input" id="ne"></div><div class="field"><label>PHONE</label><input class="input" id="np"></div><div class="field"><label>INDUSTRY</label><input class="input" id="ni" placeholder="e.g. hospitality"></div><div class="field"><label>LOCATION</label><input class="input" id="nl" placeholder="e.g. Kakamega"></div><div class="field full"><label>WEBSITE</label><input class="input" id="nw"></div><div class="field full"><label>NOTES</label><textarea class="textarea" id="nn" placeholder="Verified context only"></textarea></div></div>','<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createLead()">Create prospect</button>')}
async function createLead(){try{await api('/api/prospects',{method:'POST',body:{business_name:$('#nb').value,contact_name:$('#nc').value,email:$('#ne').value,phone:$('#np').value,industry:$('#ni').value,location:$('#nl').value,website:$('#nw').value,notes:$('#nn').value,source:'Manual'}});closeModal();toast('Prospect added');await loadPage()}catch(e){toast(e.message,true)}}
function openCampaign(){openModal('New campaign','<div class="formgrid"><div class="field full"><label>CAMPAIGN NAME</label><input class="input" id="cn" placeholder="e.g. October brand refresh"></div><div class="field"><label>SERVICE</label><select class="select" id="cs" style="width:100%"><option>Graphic Design</option><option>Branding</option><option>Meta Ads</option><option>TikTok Ads</option></select></div><div class="field"><label>DAILY LIMIT</label><input class="input" id="cl" type="number" min="1" max="10" value="10"></div><div class="field"><label>START</label><input class="input" id="cst" value="09:00"></div><div class="field"><label>END</label><input class="input" id="cen" value="17:00"></div></div>','<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createCampaign()">Create campaign</button>')}
async function createCampaign(){try{await api('/api/campaigns',{method:'POST',body:{name:$('#cn').value,service_focus:$('#cs').value,daily_limit:+$('#cl').value,sending_window_start:$('#cst').value,sending_window_end:$('#cen').value}});closeModal();toast('Campaign created');await loadPage()}catch(e){toast(e.message,true)}}
async function toggleCampaign(id,status){try{await api('/api/campaigns/'+id+'/status',{method:'POST',body:{status,confirm:true}});toast(status==='Active'?'Campaign activated':'Campaign paused');await loadPage()}catch(e){toast(e.message,true)}}
function quickDraft(id){S.data.draft={prospect_id:id};go('lab')}
async function generateDraft(){try{const prospect=$('#lp').value;if(!prospect)throw new Error('Choose a prospect first');const r=await api('/api/drafts/generate',{method:'POST',body:{prospect_id:prospect,campaign_id:$('#lc').value,service_focus:$('#ls').value,tone:$('#lt').value,verified_observation:$('#lo').value}});S.data.draft=r.draft;S.data.draft.observation=$('#lo').value;render();toast('Grounded draft created')}catch(e){toast(e.message,true)}}
async function saveDraft(){try{const d=S.data.draft;const r=await api('/api/drafts',{method:'POST',body:{id:d.id,prospect_id:d.prospect_id,campaign_id:$('#lc').value||d.campaign_id,service_focus:$('#ls').value,subject:$('#ds').value,body:$('#db').value}});S.data.draft=r.draft;render();toast('Draft saved')}catch(e){toast(e.message,true)}}
async function approveDraft(){try{await saveDraft();const r=await api('/api/drafts/'+S.data.draft.id+'/approve',{method:'POST'});S.data.draft.status=r.status;render();toast('Message approved')}catch(e){toast(e.message,true)}}
function scheduleDraft(){openModal('Schedule message','<div class="field"><label>SEND AT</label><input class="input" id="sd" type="datetime-local"></div><div class="sub">Use a future time inside the campaign sending window.</div>','<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doSchedule()">Schedule</button>')}
async function doSchedule(){try{await api('/api/drafts/'+S.data.draft.id+'/schedule',{method:'POST',body:{scheduled_for:new Date($('#sd').value).toISOString()}});closeModal();toast('Message scheduled');S.data.draft=null;await go('queue')}catch(e){toast(e.message,true)}}
async function sendNow(id){try{if(!confirm('Send this approved message now? Kyro will still enforce every safeguard and the daily limit.'))return;await api('/api/drafts/'+id+'/send',{method:'POST',body:{confirm:true}});toast('Send processed');await loadPage()}catch(e){toast(e.message,true)}}
async function openProspect(id){try{const r=await api('/api/prospects/'+id);const p=r.prospect;openModal(p.business_name,'<div class="formgrid"><div class="field"><label>CONTACT</label><div>'+esc(p.contact_name||'—')+'</div></div><div class="field"><label>EMAIL</label><div>'+esc(p.email)+'</div></div><div class="field"><label>INDUSTRY</label><div>'+esc(p.industry||'—')+'</div></div><div class="field"><label>LOCATION</label><div>'+esc(p.location||'—')+'</div></div><div class="field full"><label>NOTES</label><div class="sub" style="font-size:10px;line-height:1.6">'+esc(p.notes||'No notes')+'</div></div></div>','<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();quickDraft(\''+p.id+'\')">Draft message</button>')}catch(e){toast(e.message,true)}}
function importCsv(){openModal('Import prospects','<div class="field"><label>CSV FILE</label><input class="input" id="csv" type="file" accept=".csv,text/csv"></div><div class="sub">Headers supported: business_name, contact_name, email, phone, website, industry, location, notes, source. Existing emails are skipped.</div>','<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doImport()">Import</button>')}
function parseCsv(t){const rows=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(c==='"'&&t[i+1]==='"'){cell+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';continue}cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(!rows.length)return[];const h=rows.shift().map(x=>x.trim().toLowerCase());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}
async function doImport(){try{const f=$('#csv').files[0];if(!f)throw new Error('Choose a CSV file');const rows=parseCsv(await f.text());const r=await api('/api/import/commit',{method:'POST',body:{rows}});closeModal();toast('Imported '+r.created+' prospects');await loadPage()}catch(e){toast(e.message,true)}}
async function saveSettings(){try{await api('/api/settings',{method:'PUT',body:{sender_name:$('#wname').value,sender_email:$('#wemail').value,reply_to:$('#wreply').value,timezone:$('#wtz').value,agency_name:$('#wagency').value,tagline:$('#wtag').value,description:$('#wdesc').value,sending_window_start:$('#ws').value,sending_window_end:$('#we').value}});toast('Workspace saved');await loadPage()}catch(e){toast(e.message,true)}}
async function boot(){try{S.boot=await api('/api/bootstrap');if(!S.boot.authenticated)throw new Error('Workspace session could not be established');await loadDashboard();render()}catch(e){document.body.innerHTML='<div class="empty" style="padding-top:20vh"><b>Kyro could not connect</b><p>'+esc(e.message)+'</p><button class="btn primary" onclick="location.reload()">Retry</button></div>'}}
boot();
</script>
</body>
</html>
