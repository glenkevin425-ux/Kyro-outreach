<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="aur"><i></i><i></i><i></i></div><div id="glow"></div>
<div class="app">
  <aside id="side"><div class="brand"><span class="mark"></span>Kyro</div><i id="pill"></i><nav id="nav"></nav></aside>
  <div id="ov" data-action="close-menu"></div>
  <div class="main">
    <header>
      <button class="btn" id="menu" data-action="menu" aria-label="Open menu">Menu</button>
      <h1 id="title">Dashboard</h1>
      <button class="btn" data-action="palette">Search<kbd>Ctrl K</kbd></button>
      <button class="btn p" data-action="open-form" data-form="task">Add task<kbd>N</kbd></button>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="modal" hidden></div>
<div id="pal" hidden></div>
<input type="file" id="imp" accept="application/json" hidden>
<div id="toasts" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="intro" aria-hidden="true"><span class="mark"></span><b>Kyro</b></div>

<script src="app.js"></script>
</body>
</html>
